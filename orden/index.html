<!doctype html>
<html lang="es-AR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Orden</title>
    <meta name="description" content="Los pendientes de tu casa, en orden." />
    <meta name="theme-color" content="#0B0B10" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Orden" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <script>
      // Aplica el tema antes del primer pintado para evitar parpadeos.
      try {
        var t = localStorage.getItem('orden:theme') || 'system'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        // En iOS la barra de estado toma este color (y elige texto claro u oscuro según contraste)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#f4f2ec' : '#0b0b10')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
