name: Orden · GitHub Pages

on:
    push:
        branches: [main, claude/home-tasks-web-app-pi7hsu]
        paths:
            - "orden/**"
            - ".github/workflows/orden-pages.yml"

    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: orden-pages
    # Igual que la plantilla oficial de Pages: no cortar un deploy a la mitad
    cancel-in-progress: false

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: orden
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: orden/package-lock.json

            - run: npm ci

            - name: Tests
              run: npm test

            - name: Build
              run: npm run build
              env:
                  ORDEN_BASE: /${{ github.event.repository.name }}/

            - uses: actions/upload-pages-artifact@v4
              with:
                  path: orden/dist

    deploy:
        name: Deploy
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
